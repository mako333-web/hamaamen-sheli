<title>אטלס שרירים תלת־ממדי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600&family=EB+Garamond:ital@1&display=swap">
<style>
/* Layout: full-bleed 3D stage, a quiet atlas card floating at the top-right (RTL start), view controls docked at the bottom */
:root {
  --bg: #15100f;
  --bg-2: #211816;
  --fg: #efe6df;
  --muted: #a8968c;
  --line: #3a2c28;
  --accent: #e2735e;
  --tendon: #e6d9c3;
  --display: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --body: "Assistant", "Segoe UI", Arial, sans-serif;
  --latin: "EB Garamond", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 30%, var(--bg-2), var(--bg) 70%);
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  overflow: hidden;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; outline: none; touch-action: none; }

.card {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  width: min(340px, calc(100vw - 32px));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 10px;
}
h1 {
  font-family: var(--display); font-weight: 700;
  font-size: 1.55rem; line-height: 1.15; margin: 0;
  text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
.info { border-top: 1px solid var(--line); padding-top: 10px; min-height: 92px; display: flex; flex-direction: column; gap: 4px; }
.info .eyebrow { font-size: .72rem; letter-spacing: .08em; color: var(--accent); }
.info .name { font-family: var(--display); font-size: 1.3rem; font-weight: 500; }
.info .latin { font-family: var(--latin); font-style: italic; color: var(--tendon); direction: ltr; text-align: right; font-size: 1.05rem; }
.info .fn { color: var(--muted); font-size: .9rem; line-height: 1.5; }

.dock {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
  max-width: calc(100vw - 32px);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px;
}
.dock button {
  font: 600 .9rem var(--body);
  color: var(--fg); background: transparent;
  border: 1px solid transparent; border-radius: 999px;
  padding: 7px 14px; cursor: pointer;
}
.dock button:hover { background: var(--bg-2); }
.dock button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.dock button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint {
  position: fixed;
  left: max(16px, env(safe-area-inset-left, 0px));
  top: calc(16px + env(safe-area-inset-top, 0px));
  color: var(--muted); font-size: .8rem; line-height: 1.6;
}
@media (max-width: 640px) {
  .hint { display: none; }
  .card { padding: 12px 14px; }
  h1 { font-size: 1.25rem; }
  .sub { display: none; }
  .info { min-height: 70px; }
}
</style>

<div id="stage" aria-label="מודל תלת־ממדי של גוף האדם בשכבת השרירים"></div>

<aside class="card" dir="rtl">
  <h1>אטלס שרירים</h1>
  <p class="sub">גוף אדם מפוסל משרירים בלבד, בסגנון אקורשה (écorché). השרירים בצבע אדום, הגידים בצבע שנהב.</p>
  <div class="info" id="info" aria-live="polite">
    <span class="eyebrow" id="iGroup">רחפו מעל שריר</span>
    <span class="name" id="iName">בחרו שריר כדי לראות את שמו</span>
    <span class="latin" id="iLatin">musculi corporis humani</span>
    <span class="fn" id="iFn">גררו כדי לסובב, גלגלו או צבטו כדי להתקרב.</span>
  </div>
</aside>

<div class="hint" dir="rtl">גרירה: סיבוב<br>גלגלת / צביטה: זום<br>קליק ימני: הזזה</div>

<nav class="dock" dir="rtl" aria-label="תצוגה">
  <button id="vFront" type="button">חזית</button>
  <button id="vBack" type="button">גב</button>
  <button id="vSide" type="button">צד</button>
  <button id="vHead" type="button">ראש</button>
  <button id="vSpin" type="button" aria-pressed="true">סיבוב אוטומטי</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const V = (x, y, z) => new THREE.Vector3(x, y, z);

  // ---------- renderer / scene ----------
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.85;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50);
  camera.position.set(0, 1.0, 4.1);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.86, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.4;
  controls.maxDistance = 7;
  controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  controls.autoRotateSpeed = 0.8;
  document.getElementById('vSpin').setAttribute('aria-pressed', String(controls.autoRotate));

  scene.add(new THREE.HemisphereLight(0xffe9dc, 0x2a1512, 0.75));
  const key = new THREE.DirectionalLight(0xfff1e6, 1.6); key.position.set(1.6, 2.6, 2.2); scene.add(key);
  const rim = new THREE.DirectionalLight(0xff9a80, 0.9); rim.position.set(-2, 1.6, -2.4); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xbfd0ff, 0.35); fill.position.set(-2, 0.5, 1.5); scene.add(fill);

  // plinth
  const plinth = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42, 0.46, 0.05, 64),
    new THREE.MeshStandardMaterial({ color: 0x2b201d, roughness: 0.9 })
  );
  plinth.position.y = -0.025; scene.add(plinth);

  // ---------- fibre texture (stripes run along the muscle's length) ----------
  function fibreTexture() {
    const c = document.createElement('canvas'); c.width = 256; c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = '#d8d8d8'; g.fillRect(0, 0, 256, 64);
    for (let x = 0; x < 256; x += 2) {
      const l = 150 + Math.random() * 105 | 0;
      g.fillStyle = `rgb(${l},${l},${l})`;
      g.fillRect(x, 0, 1 + (Math.random() * 2 | 0), 64);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(3, 1);
    return t;
  }
  const fibre = fibreTexture();

  const MUSCLE = new THREE.Color(0.46, 0.055, 0.045);
  const DEEP = new THREE.Color(0.36, 0.065, 0.055);
  const TENDON = new THREE.Color(0.86, 0.80, 0.70);

  // ---------- spindle geometry: a fusiform muscle belly between two points ----------
  function spindle(o) {
    const a = o.a, b = o.b;
    const rA = o.rA ?? 0.01, rM = o.rM ?? 0.02, rB = o.rB ?? 0.01;
    const p = o.p ?? 1, sx = o.sx ?? 1, sz = o.sz ?? 1;
    const tA = o.tA ?? 0, tB = o.tB ?? 0;
    const base = o.color || MUSCLE;
    const rings = o.rings || 30, segs = o.segs || 20;
    const Y = b.clone().sub(a); const L = Y.length(); Y.normalize();
    let n0 = o.n ? o.n.clone().normalize() : (Math.abs(Y.z) < 0.9 ? V(0, 0, 1) : V(1, 0, 0));
    const Z = n0.sub(Y.clone().multiplyScalar(n0.dot(Y))).normalize();
    const X = Y.clone().cross(Z).normalize();
    const bend = o.bend || V(0, 0, 0);
    const pos = [], col = [], uv = [], idx = [];
    const c = new THREE.Color();
    for (let i = 0; i <= rings; i++) {
      const t = i / rings;
      let r = rA + (rB - rA) * t + rM * Math.pow(Math.sin(Math.PI * t), p);
      const e = Math.min(1, Math.min(t, 1 - t) / 0.07);
      r *= Math.sqrt(e);
      const ctr = a.clone().addScaledVector(Y, t * L).addScaledVector(bend, Math.sin(Math.PI * t));
      // tendon blend
      let k = 0;
      if (tA > 0 && t < tA) k = 1 - t / tA;
      if (tB > 0 && t > 1 - tB) k = Math.max(k, (t - (1 - tB)) / tB);
      k = Math.min(1, k * 1.6);
      c.copy(base).lerp(TENDON, k);
      for (let j = 0; j <= segs; j++) {
        const th = (j / segs) * Math.PI * 2;
        const q = ctr.clone()
          .addScaledVector(X, Math.cos(th) * sx * r)
          .addScaledVector(Z, Math.sin(th) * sz * r);
        pos.push(q.x, q.y, q.z);
        col.push(c.r, c.g, c.b);
        uv.push(j / segs, t);
      }
    }
    const w = segs + 1;
    for (let i = 0; i < rings; i++) for (let j = 0; j < segs; j++) {
      const v0 = i * w + j, v1 = (i + 1) * w + j, v2 = i * w + j + 1, v3 = (i + 1) * w + j + 1;
      idx.push(v0, v1, v2, v1, v3, v2);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    return geo;
  }
  function blob(center, scale, color) {
    const g = new THREE.SphereGeometry(1, 40, 28);
    g.scale(scale.x, scale.y, scale.z);
    g.translate(center.x, center.y, center.z);
    const n = g.attributes.position.count, col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { col[i * 3] = color.r; col[i * 3 + 1] = color.g; col[i * 3 + 2] = color.b; }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return g;
  }
  function torus(center, R, r, rot, color, sy) {
    const g = new THREE.TorusGeometry(R, r, 12, 40);
    if (sy) g.scale(1, sy, 1);
    if (rot) g.rotateY(rot);
    g.translate(center.x, center.y, center.z);
    const n = g.attributes.position.count, col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { col[i * 3] = color.r; col[i * 3 + 1] = color.g; col[i * 3 + 2] = color.b; }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return g;
  }

  const mats = [];
  function material() {
    const m = new THREE.MeshStandardMaterial({
      vertexColors: true, map: fibre, roughness: 0.48, metalness: 0.0,
      emissive: new THREE.Color(0, 0, 0)
    });
    mats.push(m); return m;
  }
  const deepMat = new THREE.MeshStandardMaterial({ vertexColors: true, map: fibre, roughness: 0.7 });
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xf1ece4, roughness: 0.2 });

  const figure = new THREE.Group(); scene.add(figure);
  const pickables = [];
  const byId = {};

  function addMesh(geo, mat, mirror, info) {
    const m = new THREE.Mesh(geo, mat);
    figure.add(m);
    if (info) { m.userData.info = info; pickables.push(m); (byId[info.id] = byId[info.id] || []).push(m); }
    if (mirror) {
      const m2 = new THREE.Mesh(geo, info ? mat : mat);
      m2.scale.x = -1; figure.add(m2);
      if (info) { m2.userData.info = info; pickables.push(m2); byId[info.id].push(m2); }
    }
  }

  // ---------- deep layer (fills the gaps between superficial muscles) ----------
  const deep = [
    blob(V(0, 1.285, -0.005), V(0.138, 0.165, 0.098), DEEP),          // rib cage
    blob(V(0, 1.03, 0.0), V(0.128, 0.15, 0.09), DEEP),               // abdomen
    blob(V(0, 0.92, -0.005), V(0.15, 0.09, 0.1), DEEP),              // pelvis
    blob(V(0, 1.655, 0.002), V(0.078, 0.1, 0.092), DEEP),            // cranium
    blob(V(0, 1.585, 0.032), V(0.058, 0.045, 0.064), DEEP),          // jaw
    spindle({ a: V(0, 1.40, -0.012), b: V(0, 1.62, 0.0), rA: 0.05, rM: 0.0, rB: 0.046, color: DEEP })
  ];
  deep.forEach(g => addMesh(g, deepMat, false));
  const deepLimbs = [
    spindle({ a: V(0.17, 1.45, 0), b: V(0.275, 1.12, 0.005), rA: 0.04, rM: 0.006, rB: 0.03, color: DEEP }),
    spindle({ a: V(0.27, 1.16, 0.005), b: V(0.335, 0.885, 0.02), rA: 0.033, rM: 0.004, rB: 0.02, color: DEEP }),
    spindle({ a: V(0.09, 0.97, 0), b: V(0.10, 0.50, 0.01), rA: 0.08, rM: 0.004, rB: 0.05, color: DEEP }),
    spindle({ a: V(0.10, 0.53, 0.01), b: V(0.10, 0.07, -0.01), rA: 0.048, rM: 0.004, rB: 0.028, color: DEEP }),
    spindle({ a: V(0.10, 0.035, -0.055), b: V(0.112, 0.022, 0.15), rA: 0.03, rM: 0.012, rB: 0.022, sx: 1.25, sz: 0.65, n: V(0, 1, 0), color: DEEP }),
    spindle({ a: V(0.33, 0.895, 0.022), b: V(0.348, 0.795, 0.028), rA: 0.02, rM: 0.008, rB: 0.024, sx: 1.4, sz: 0.5, n: V(0, 0, 1), color: DEEP })
  ];
  deepLimbs.forEach(g => addMesh(g, deepMat, true));

  // eyes
  addMesh(new THREE.SphereGeometry(0.0125, 20, 14).translate(0.03, 1.668, 0.083), eyeMat, true);

  // ---------- superficial muscles ----------
  const M = [];
  const def = (id, group, he, la, fn, parts, mirror = true) => M.push({ id, group, he, la, fn, parts, mirror });
  const S = o => spindle(o);

  // Head & face
  def('frontalis', 'ראש ופנים', 'שריר המצח', 'm. frontalis', 'מרים את הגבות ומקמט את המצח.', [
    S({ a: V(0.028, 1.745, 0.05), b: V(0.03, 1.69, 0.088), rA: 0.006, rM: 0.02, rB: 0.006, sx: 1.6, sz: 0.25, n: V(0, 0.2, 1), tA: 0.3 })
  ]);
  def('galea', 'ראש ופנים', 'יריעת הגולגולת', 'galea aponeurotica', 'יריעת גיד שטוחה שמחברת את שריר המצח לשריר העורף.', [
    blob(V(0, 1.70, -0.005), V(0.074, 0.06, 0.086), TENDON)
  ], false);
  def('temporalis', 'ראש ופנים', 'שריר הרקה', 'm. temporalis', 'סוגר את הלסת ומושך אותה לאחור בזמן לעיסה.', [
    S({ a: V(0.07, 1.715, -0.015), b: V(0.064, 1.625, 0.035), rA: 0.012, rM: 0.024, rB: 0.006, sx: 1.4, sz: 0.3, n: V(1, 0, 0.1), tB: 0.2 })
  ]);
  def('orbicularis-oculi', 'ראש ופנים', 'שריר טבעת העין', 'm. orbicularis oculi', 'סוגר את העפעפיים ומצמץ.', [
    torus(V(0.03, 1.668, 0.086), 0.018, 0.0055, 0.0, MUSCLE)
  ]);
  def('masseter', 'ראש ופנים', 'שריר הלעיסה', 'm. masseter', 'השריר החזק ביותר בלסת. מרים את הלסת התחתונה וסוגר את הפה.', [
    S({ a: V(0.062, 1.625, 0.045), b: V(0.056, 1.55, 0.03), rA: 0.01, rM: 0.016, rB: 0.008, sx: 1.2, sz: 0.45, n: V(1, 0, 0.2), tA: 0.2 })
  ]);
  def('zygomaticus', 'ראש ופנים', 'שריר הלחי הגדול', 'm. zygomaticus major', 'מושך את זוויות הפה למעלה ולצדדים. שריר החיוך.', [
    S({ a: V(0.058, 1.635, 0.068), b: V(0.026, 1.585, 0.098), rA: 0.004, rM: 0.004, rB: 0.004 })
  ]);
  def('orbicularis-oris', 'ראש ופנים', 'שריר טבעת הפה', 'm. orbicularis oris', 'סוגר ומכווץ את השפתיים.', [
    torus(V(0, 1.582, 0.095), 0.02, 0.0065, 0, MUSCLE, 0.55)
  ], false);
  def('nasalis', 'ראש ופנים', 'סחוס האף', 'cartilagines nasi', 'מבנה הסחוס שנותן לאף את צורתו.', [
    S({ a: V(0, 1.65, 0.09), b: V(0, 1.608, 0.112), rA: 0.006, rM: 0.006, rB: 0.01, sx: 1.4, sz: 1, color: TENDON })
  ], false);

  // Neck
  def('scm', 'צוואר', 'השריר המסובב (עטרתי־בריחי)', 'm. sternocleidomastoideus', 'מסובב את הראש לצד הנגדי ומכופף את הצוואר.', [
    S({ a: V(0.062, 1.63, -0.02), b: V(0.016, 1.44, 0.07), rA: 0.012, rM: 0.01, rB: 0.007, tA: 0.12, tB: 0.18 })
  ]);
  def('trapezius', 'גב', 'השריר הטרפזי', 'm. trapezius', 'מרים, מקרב ומוריד את השכמה. מיישב את הכתפיים ותומך בראש.', [
    S({ a: V(0.01, 1.6, -0.06), b: V(0.165, 1.452, -0.03), rA: 0.012, rM: 0.014, rB: 0.01, sx: 1.5, sz: 0.35, n: V(0.5, 1, -0.5), tA: 0.15, bend: V(0, -0.012, -0.008) }),
    S({ a: V(0.0, 1.44, -0.095), b: V(0.165, 1.435, -0.06), rA: 0.03, rM: 0.008, rB: 0.016, sx: 1.2, sz: 0.35, n: V(0, 0.3, -1) }),
    S({ a: V(0.0, 1.17, -0.098), b: V(0.105, 1.39, -0.1), rA: 0.008, rM: 0.03, rB: 0.016, sx: 1.4, sz: 0.3, n: V(0, 0, -1), tA: 0.12 })
  ]);

  // Chest & abdomen
  def('pectoralis', 'חזה', 'שריר החזה הגדול', 'm. pectoralis major', 'מקרב את הזרוע לגוף ומסובב אותה פנימה. שריר הדחיפה העיקרי.', [
    S({ a: V(0.018, 1.31, 0.104), b: V(0.165, 1.37, 0.035), rA: 0.04, rM: 0.012, rB: 0.012, sx: 1.25, sz: 0.4, n: V(0.2, 0, 1), tB: 0.12, bend: V(0, -0.02, 0.012) }),
    S({ a: V(0.035, 1.42, 0.08), b: V(0.16, 1.385, 0.04), rA: 0.022, rM: 0.008, rB: 0.01, sx: 1.2, sz: 0.4, n: V(0.1, 0.4, 1) })
  ]);
  def('serratus', 'חזה', 'השריר המשונן הקדמי', 'm. serratus anterior', 'מושך את השכמה קדימה סביב בית החזה. שריר "האגרוף".', [1.285, 1.245, 1.205, 1.165].map((y, i) =>
    S({ a: V(0.142, y + 0.03, -0.01), b: V(0.118 - i * 0.004, y - 0.01, 0.07), rA: 0.008, rM: 0.009, rB: 0.004, sx: 1.2, sz: 0.6, n: V(1, 0, 0.3) }))
  );
  def('rectus-abdominis', 'בטן', 'שריר הבטן הישר', 'm. rectus abdominis', 'מכופף את עמוד השדרה קדימה. ה"שש־קוביות", מחולק בגידים רוחביים.', [1.175, 1.11, 1.045, 0.975].map((y, i) =>
    S({ a: V(0.036, y + 0.032, 0.104 - i * 0.001), b: V(0.034, y - 0.032, 0.104 - i * 0.002), rA: 0.022, rM: 0.01, rB: 0.022, sx: 1.25, sz: 0.4, n: V(0, 0, 1) })).concat([

  // ---------- interaction ----------
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  let hovered = null, selected = null, downAt = null;
  const iGroup = document.getElementById('iGroup'), iName = document.getElementById('iName'),
        iLatin = document.getElementById('iLatin'), iFn = document.getElementById('iFn');

  function show(info) {
    if (!info) {
      iGroup.textContent = 'רחפו מעל שריר';
      iName.textContent = 'בחרו שריר כדי לראות את שמו';
      iLatin.textContent = 'musculi corporis humani';
      iFn.textContent = 'גררו כדי לסובב, גלגלו או צבטו כדי להתקרב.';
      return;
    }
    iGroup.textContent = info.group;
    iName.textContent = info.he;
    iLatin.textContent = info.la;
    iFn.textContent = info.fn;
  }
  function paint() {
    M.forEach(m => {
      const on = m === hovered || m === selected;
      m.mat.emissive.setRGB(on ? 0.22 : 0, on ? 0.1 : 0, on ? 0.04 : 0);
    });
  }
  function pick(ev) {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
    ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(pickables, false)[0];
    return hit ? hit.object.userData.info : null;
  }
  renderer.domElement.addEventListener('pointermove', ev => {
    if (ev.pointerType !== 'mouse') return;
    const info = pick(ev);
    if (info !== hovered) {
      hovered = info; paint(); show(hovered || selected);
      renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
    }
  });
  renderer.domElement.addEventListener('pointerdown', ev => { downAt = [ev.clientX, ev.clientY]; });
  renderer.domElement.addEventListener('pointerup', ev => {
    if (!downAt) return;
    const moved = Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]);
    downAt = null;
    if (moved > 6) return;
    selected = pick(ev); paint(); show(selected);
  });

  // ---------- views ----------
  let anim = null;
  function goTo(pos, target) {
    anim = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, s: performance.now() };
    setSpin(false);
  }
  function setSpin(on) {
    controls.autoRotate = on;
    document.getElementById('vSpin').setAttribute('aria-pressed', String(on));
  }
  document.getElementById('vFront').onclick = () => goTo(V(0, 1.0, 4.1), V(0, 0.86, 0));
  document.getElementById('vBack').onclick = () => goTo(V(0, 1.0, -4.1), V(0, 0.86, 0));
  document.getElementById('vSide').onclick = () => goTo(V(4.1, 1.0, 0), V(0, 0.86, 0));
  document.getElementById('vHead').onclick = () => goTo(V(0.35, 1.68, 0.75), V(0, 1.6, 0));
  document.getElementById('vSpin').onclick = () => setSpin(!controls.autoRotate);
  controls.addEventListener('start', () => { anim = null; });

  // ---------- resize / loop ----------
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = w + 'px';
    renderer.domElement.style.height = h + 'px';
    camera.aspect = w / h;
    camera.fov = w < 640 ? 40 : 32;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  function loop(now) {
    if (anim) {
      let k = Math.min(1, (now - anim.s) / 900); k = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      camera.position.lerpVectors(anim.p0, anim.p1, k);
      controls.target.lerpVectors(anim.t0, anim.t1, k);
      if (k >= 1) anim = null;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
