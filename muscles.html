<title>מערכת השרירים Z-Anatomy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600&family=EB+Garamond:ital@1&display=swap">
<style>
/* Layout: full-bleed 3D stage; atlas card top-right (RTL start) with search and the selected muscle; view dock along the bottom */
:root {
  --bg: #141010;
  --bg-2: #221817;
  --fg: #efe6df;
  --muted: #a8968c;
  --line: #3a2c28;
  --accent: #e8836b;
  --tendon: #e6d9c3;
  --display: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --body: "Assistant", "Segoe UI", Arial, sans-serif;
  --latin: "EB Garamond", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 30%, var(--bg-2), var(--bg) 70%);
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  overflow: hidden;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; outline: none; touch-action: none; }

.card {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  width: min(340px, calc(100vw - 32px));
  max-height: calc(100% - 120px);
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 0;
}
h1 { font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: .88rem; line-height: 1.5; }
.info { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; min-height: 84px; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; color: var(--accent); }
.name { font-family: var(--latin); font-style: italic; font-size: 1.3rem; direction: ltr; text-align: right; color: var(--fg); }
.side { color: var(--muted); font-size: .9rem; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  font: 600 .85rem var(--body); color: var(--fg); background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; border-color: var(--line); }
.btn:focus-visible, input:focus-visible, .dock button:focus-visible, .results button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#q {
  width: 100%; font: 1rem var(--body); color: var(--fg); background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; direction: ltr;
}
#q::placeholder { color: var(--muted); }
.results { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 2px; }
.results button {
  text-align: left; direction: ltr; font: italic 1rem var(--latin); color: var(--fg);
  background: transparent; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer;
}
.results button:hover { background: var(--bg-2); color: var(--accent); }
.credit { font-size: .75rem; color: var(--muted); line-height: 1.5; }
.credit a { color: var(--tendon); }

.dock {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
  max-width: calc(100vw - 32px);
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px;
}
.dock button {
  font: 600 .9rem var(--body); color: var(--fg); background: transparent;
  border: 1px solid transparent; border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.dock button:hover { background: var(--bg-2); }
.dock button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.loading {
  position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
}
.loading[hidden] { display: none; }
.loading div { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); }
.bar { width: 220px; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
@media (max-width: 640px) {
  .card { padding: 12px 14px; max-height: 46%; }
  h1 { font-size: 1.2rem; }
  .sub { display: none; }
}
</style>

<div id="stage" aria-label="מודל תלת־ממדי של מערכת השרירים"></div>

<div class="loading" id="loading" dir="rtl">
  <div><span id="lText">טוען את המודל (37MB)…</span><span class="bar"><i id="lBar"></i></span></div>
</div>

<aside class="card" dir="rtl">
  <h1>מערכת השרירים</h1>
  <p class="sub">מודל אנטומי מלא מבוסס סריקות רפואיות. כ־790 שרירים וגידים, כל אחד בשמו האנטומי.</p>
  <div class="info" aria-live="polite">
    <span class="eyebrow" id="iEyebrow">רחפו או לחצו על שריר</span>
    <span class="name" id="iName">Systema musculare</span>
    <span class="side" id="iSide">לחיצה בוחרת שריר. אפשר להסתיר אותו ולראות את השכבה שמתחתיו.</span>
    <div class="row">
      <button class="btn" id="bHide" type="button" disabled>הסתר שריר</button>
      <button class="btn" id="bIsolate" type="button" disabled>הצג רק אותו</button>
      <button class="btn" id="bShowAll" type="button">הצג הכל</button>
    </div>
  </div>
  <input id="q" type="search" placeholder="Search: biceps, deltoid…" aria-label="חיפוש שריר לפי שם באנגלית" autocomplete="off">
  <div class="results" id="results"></div>
  <div class="credit">מודל: <a href="https://github.com/LluisV/Z-Anatomy" target="_blank" rel="noopener">Z-Anatomy</a>, מבוסס BodyParts3D (DBCLS). רישיון <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.</div>
</aside>

<nav class="dock" dir="rtl" aria-label="תצוגה">
  <button id="vFront" type="button">חזית</button>
  <button id="vBack" type="button">גב</button>
  <button id="vSide" type="button">צד</button>
  <button id="vHead" type="button">ראש</button>
  <button id="vFascia" type="button" aria-pressed="false">פאסיות</button>
  <button id="vSpin" type="button" aria-pressed="false">סיבוב אוטומטי</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/curves/NURBSUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/curves/NURBSCurve.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script>
(function () {
  // the FBX file is stored as four base64 text parts (each published file must be under 16MB)
  const PARTS = [0, 1, 2, 3].map(i => 'model/muscles.part' + i + '.txt');
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 100);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.autoRotateSpeed = 0.7;

  scene.add(new THREE.HemisphereLight(0xffe9dc, 0x2a1512, 0.7));
  const key = new THREE.DirectionalLight(0xfff1e6, 1.5); key.position.set(1.6, 2.6, 2.2); scene.add(key);
  const rim = new THREE.DirectionalLight(0xff9a80, 0.9); rim.position.set(-2, 1.6, -2.4); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xbfd0ff, 0.35); fill.position.set(-2, 0.5, 1.5); scene.add(fill);

  const TENDON_RE = /tendon|aponeuros|ligament|retinacul|ring|tarsus|fascia|tract|sheath|trochlea|septum|linea|raphe|arch|bursa|cartilage|disc|meniscus|capsule|membrane/i;
  const matMuscle = new THREE.MeshStandardMaterial({ color: 0x6a160f, roughness: 0.5, metalness: 0 });
  const matTendon = new THREE.MeshStandardMaterial({ color: 0xe2d5bf, roughness: 0.45, metalness: 0 });
  const matHover = new THREE.MeshStandardMaterial({ color: 0xa02a0c, roughness: 0.45, emissive: 0x2a0800 });
  const matSel = new THREE.MeshStandardMaterial({ color: 0xff5a00, roughness: 0.4, emissive: 0x6a1c00 });

  const FASCIA_RE = /\bfascia\b|fasciae(?! latae)|bursa|sheath|septum/i;
  const matFascia = new THREE.MeshStandardMaterial({ color: 0xf2ece2, roughness: 0.35, transparent: true, opacity: 0.45, depthWrite: false });
  const fascia = [];
  let meshes = [], hovered = null, selected = null, downAt = null, home = null;
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();

  const $ = id => document.getElementById(id);
  const sideHe = n => /\.l$/i.test(n) ? 'צד שמאל' : /\.r$/i.test(n) ? 'צד ימין' : 'קו האמצע';
  const clean = n => n.replace(/\.[lr]$/i, '').replace(/_/g, ' ').replace(/\d+$/, '').trim();

  function setMat(m) {
    m.material = m === selected ? matSel : m === hovered ? matHover : m.userData.base;
  }
  function show(m) {
    if (!m) {
      $('iEyebrow').textContent = 'רחפו או לחצו על שריר';
      $('iName').textContent = 'Systema musculare';
      $('iSide').textContent = 'לחיצה בוחרת שריר. אפשר להסתיר אותו ולראות את השכבה שמתחתיו.';
    } else {
      $('iEyebrow').textContent = m.userData.base === matTendon ? 'גיד / רקמת חיבור' : 'שריר';
      $('iName').textContent = m.userData.label;
      $('iSide').textContent = sideHe(m.name);
    }
    $('bHide').disabled = $('bIsolate').disabled = !selected;
  }
  function select(m) {
    const prev = selected; selected = m;
    if (prev) setMat(prev); if (m) setMat(m);
    show(m || hovered);
  }

  // ---------- load: fetch the three parts, join, parse ----------
  async function load() {
    const total = 12447728 * 4;
    const got = [0, 0, 0, 0];
    const bufs = await Promise.all(PARTS.map(async (url, i) => {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + url);
      const reader = res.body.getReader(), chunks = [];
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); got[i] += value.length;
        $('lBar').style.width = (100 * got.reduce((a, b) => a + b, 0) / total).toFixed(1) + '%';
      }
      const text = (await new Blob(chunks).text()).trim();
      const bin = atob(text), out = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) out[k] = bin.charCodeAt(k);
      return out;
    }));
    $('lText').textContent = 'בונה את המודל…';
    await new Promise(r => setTimeout(r, 30));
    const buf = await new Blob(bufs).arrayBuffer();
    // keep original node names (".l" / ".r" mark the body side); the loader would strip the dots
    const sanitize = THREE.PropertyBinding.sanitizeNodeName;
    THREE.PropertyBinding.sanitizeNodeName = n => n;
    let root;
    try { root = new THREE.FBXLoader().parse(buf, ''); }
    finally { THREE.PropertyBinding.sanitizeNodeName = sanitize; }
    const isFascia = o => { for (let p = o; p; p = p.parent) if (FASCIA_RE.test(p.name || '')) return true; return false; };
    root.traverse(o => {
      if (o.isMesh && isFascia(o)) {
        o.material = matFascia; o.visible = false; fascia.push(o);
      } else if (o.isMesh) {
        o.userData.base = TENDON_RE.test(o.name) ? matTendon : matMuscle;
        o.userData.label = clean(o.name);
        o.material = o.userData.base;
        if (o.geometry && !o.geometry.attributes.normal) o.geometry.computeVertexNormals();
        meshes.push(o);
      } else if (o.isLight || o.isCamera) { o.visible = false; }
    });
    scene.add(root);
    // fit
    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    // stand the figure upright if its tallest axis isn't Y
    if (size.z > size.y * 1.2) { root.rotation.x = -Math.PI / 2; root.updateMatrixWorld(true); box.setFromObject(root); box.getSize(size); box.getCenter(c); }
    const h = size.y;
    home = { c: c.clone(), h, d: h * 2.35, box: box.clone() };
    controls.minDistance = h * 0.1; controls.maxDistance = h * 6;
    camera.near = h * 0.005; camera.far = h * 20; camera.updateProjectionMatrix();
    camera.position.set(c.x, c.y + h * 0.05, c.z + home.d);
    controls.target.copy(c);
    $('loading').hidden = true;
    controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    $('vSpin').setAttribute('aria-pressed', String(controls.autoRotate));
  }
  load().catch(err => { $('lText').textContent = 'הטעינה נכשלה: ' + err.message; console.error(err); });

  // ---------- picking ----------
  function pick(ev) {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
    ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(meshes.filter(m => m.visible), false)[0];
    return hit ? hit.object : null;
  }
  let pending = null;
  renderer.domElement.addEventListener('pointermove', ev => {
    if (ev.pointerType !== 'mouse' || ev.buttons) return;
    pending = ev;
  });
  setInterval(() => {
    if (!pending || !meshes.length) return;
    const m = pick(pending); pending = null;
    if (m !== hovered) {
      const prev = hovered; hovered = m;
      if (prev) setMat(prev); if (m) setMat(m);
      show(selected || hovered);
      renderer.domElement.style.cursor = m ? 'pointer' : 'grab';
    }
  }, 60);
  renderer.domElement.addEventListener('pointerdown', ev => { downAt = [ev.clientX, ev.clientY]; });
  renderer.domElement.addEventListener('pointerup', ev => {
    if (!downAt) return;
    const moved = Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]); downAt = null;
    if (moved > 6 || !meshes.length) return;
    select(pick(ev));
  });

  $('bHide').onclick = () => { if (!selected) return; const m = selected; select(null); m.visible = false; };
  $('bIsolate').onclick = () => { if (!selected) return; meshes.forEach(m => { m.visible = m === selected; }); focusOn(selected); };
  $('bShowAll').onclick = () => { meshes.forEach(m => { m.visible = true; }); };

  // ---------- search ----------
  $('q').addEventListener('input', () => {
    const q = $('q').value.trim().toLowerCase(), out = $('results');
    out.textContent = '';
    if (q.length < 2) return;
    const seen = new Set();
    meshes.filter(m => m.name.toLowerCase().includes(q)).slice(0, 40).forEach(m => {
      const b = document.createElement('button'); b.type = 'button';
      b.textContent = m.userData.label + (/\.l$/i.test(m.name) ? ' (L)' : /\.r$/i.test(m.name) ? ' (R)' : '');
      if (seen.has(b.textContent)) return; seen.add(b.textContent);
      b.onclick = () => { m.visible = true; select(m); focusOn(m); };
      out.appendChild(b);
    });
    if (!out.children.length) { const s = document.createElement('span'); s.className = 'side'; s.textContent = 'לא נמצא שריר בשם הזה. חפשו באנגלית.'; out.appendChild(s); }
  });

  // ---------- camera moves ----------
  let anim = null;
  function goTo(pos, target) { anim = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, s: performance.now() }; setSpin(false); }
  function focusOn(m) {
    const b = new THREE.Box3().setFromObject(m), c = b.getCenter(new THREE.Vector3());
    const r = Math.max(b.getSize(new THREE.Vector3()).length(), home.h * 0.08);
    const dir = camera.position.clone().sub(controls.target).normalize();
    goTo(c.clone().addScaledVector(dir, r * 2.6), c);
  }
  function setSpin(on) { controls.autoRotate = on; $('vSpin').setAttribute('aria-pressed', String(on)); }
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  $('vFront').onclick = () => home && goTo(V(home.c.x, home.c.y + home.h * 0.05, home.c.z + home.d), home.c.clone());
  $('vBack').onclick = () => home && goTo(V(home.c.x, home.c.y + home.h * 0.05, home.c.z - home.d), home.c.clone());
  $('vSide').onclick = () => home && goTo(V(home.c.x + home.d, home.c.y + home.h * 0.05, home.c.z), home.c.clone());
  $('vHead').onclick = () => {
    if (!home) return;
    const t = V(home.c.x, home.box.max.y - home.h * 0.07, home.c.z);
    goTo(V(t.x + home.h * 0.12, t.y + home.h * 0.02, t.z + home.h * 0.38), t);
  };
  $('vSpin').onclick = () => setSpin(!controls.autoRotate);
  $('vFascia').onclick = () => {
    const on = $('vFascia').getAttribute('aria-pressed') !== 'true';
    fascia.forEach(m => { m.visible = on; });
    $('vFascia').setAttribute('aria-pressed', String(on));
  };
  controls.addEventListener('start', () => { anim = null; });

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
    camera.aspect = w / h; camera.fov = w < 640 ? 40 : 32; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  function loop(now) {
    if (anim) {
      let k = Math.min(1, (now - anim.s) / 900); k = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      camera.position.lerpVectors(anim.p0, anim.p1, k); controls.target.lerpVectors(anim.t0, anim.t1, k);
      if (k >= 1) anim = null;
    }
    controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
