<style>
html,body{direction:rtl}
/* Layout: single-column phone app. Summary strip → week → the selected day's session; fixed tab bar. One accent (brand lime), teal reserved for running and rest. */
:root{color-scheme:dark;
--bg:#071a1b;--sf:#0c2526;--sf2:#123233;--ln:#1c3d3e;--ink:#eaf3ef;--mut:#a3bcb7;--dim:#7d9a96;
--ac:#d4f24a;--acx:#0b3b3c;--run:#7fe3d4;--bad:#ff9d8f;
--fd:'Secular One',Heebo,system-ui,sans-serif;--fb:Heebo,system-ui,sans-serif;--fn:'Space Grotesk',Heebo,system-ui,sans-serif;--r:18px}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--fb)}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-block:16px 116px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h1{font:400 30px/1.15 var(--fd);letter-spacing:-.3px;text-wrap:balance}
h2{font:700 19px/1.3 var(--fb);text-wrap:balance}
b{font-weight:700}
.eye{font:500 13px/1.3 var(--fb);color:var(--mut);letter-spacing:.2px}
.note{font-size:15px;color:var(--mut)}
.n{font-family:var(--fn);font-variant-numeric:tabular-nums}
button,label.btn2,summary{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button{background:none;border:0;padding:0;text-align:inherit}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:16px;background:var(--ac);color:var(--acx);font-weight:800;font-size:17px;width:100%;transition:transform .12s}
.btn:active,.btn2:active,.tile:active,.opt:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.run{background:var(--run)}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;background:var(--sf2);color:var(--ink);font-weight:700;font-size:15px;transition:transform .12s}
.btn2 svg{width:18px;height:18px}
.lgl{text-align:center;margin:8px 0 0}.lgl .ghost{font-size:12px;min-height:44px;text-decoration:underline;display:inline-flex}.lg ul{margin:8px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}.lg p{margin:6px 0 0}
.ghost{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-weight:500;min-height:44px;padding:0 6px}
.ghost svg{width:16px;height:16px}
.ic{width:40px;height:40px;border-radius:12px;background:var(--sf2);display:inline-grid;place-items:center;color:var(--ink);flex:none}
.ic svg{width:20px;height:20px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;width:100%;text-align:start}
.card.list{gap:0}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font:500 13px/1 var(--fn);color:var(--mut);background:var(--sf2);border-radius:999px;padding:7px 10px;white-space:nowrap}
.tag svg{width:14px;height:14px}
.tag.ac{color:var(--ac);background:rgba(212,242,74,.1)}
.tag.run{color:var(--run);background:rgba(127,227,212,.1)}
.err{color:var(--bad);font-size:14px}
/* summary */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 20px/1.2 var(--fn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--mut)}
/* calendar */
.cal{display:flex;flex-direction:column;gap:10px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.d{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:14px;border:1px solid transparent;min-width:0}
.d small{font-size:12px;color:var(--mut)}
.d b{font:700 17px/1 var(--fn)}
.d.today b{color:var(--ac)}
.d.on{background:var(--sf2);border-color:var(--ln)}
.d.sm{padding:6px 0 5px}
.d.sm b{font-size:14px}
.dh{text-align:center;font-size:12px;color:var(--mut)}
.dots{display:flex;gap:3px;height:7px}
.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ac)}
.dots i.r{border-color:var(--run)}
.dots i.ok{background:var(--ac)}
.dots i.r.ok{background:var(--run)}
.d.p0{background:rgba(212,242,74,.1);border-color:var(--ac)}.d.p0 b{color:var(--ac)}
.d.p1{background:rgba(127,227,212,.1);border-color:var(--run)}.d.p1 b{color:var(--run)}
/* exercise list */
.exl{display:flex;flex-direction:column}
.exr{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--ln);width:100%;text-align:start}
.exl>.exr:first-child{border-top:0}
.ix{font:700 13px/1 var(--fn);color:var(--dim);text-align:center}
.nm{min-width:0;display:flex;flex-direction:column;gap:2px;font-weight:500}
.nm small{font:500 13px/1.3 var(--fn);color:var(--ac)}
.sp{font:500 14px/1.3 var(--fn);color:var(--mut);text-align:end;max-width:46vw}
.exr.mute .nm{color:var(--mut);font-weight:400}
.ssg{background:var(--sf2);border-radius:14px;padding:0 10px;margin:4px -8px}
.ssg .exr{border-top-color:#1f4445}
.ssg .ix{color:var(--ac)}
.ssh{font-size:12px;color:var(--mut);padding:8px 0 0}
.ssh+.exr{border-top:0}
.dv{display:flex;flex-direction:column;gap:8px;padding:4px 0 12px}
/* controls */
.stp{display:inline-flex;align-items:center;background:var(--sf2);border-radius:12px;height:40px}
.stp button{width:38px;height:40px;display:grid;place-items:center;color:var(--ink);font-size:20px;font-family:var(--fn)}
.stp span{min-width:62px;text-align:center;font:700 15px var(--fn)}
.stp.lg{height:60px;border-radius:16px}
.stp.lg button{width:60px;height:60px;font-size:26px}
.stp.lg input{width:100px;text-align:center;background:none;border:0;font:700 26px var(--fn);padding:0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:15px}
.chip svg{width:14px;height:14px}
.chip.on{border-color:var(--ac);color:var(--ac);background:rgba(212,242,74,.08)}
.seg{display:flex;background:var(--sf2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:10px;text-align:center;color:var(--mut);font-weight:700;font-size:15px}
.seg button.on{background:var(--ac);color:var(--acx)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:0 18px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);font-weight:700;font-size:17px;width:100%}
.opt svg{width:20px;height:20px;opacity:0}
.opt.on{border-color:var(--ac);color:var(--ac)}
.opt.on svg{opacity:1}
.prog{height:4px;border-radius:2px;background:var(--sf2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);border-radius:2px}
input:not([type=file]),textarea{width:100%;max-width:100%;background:var(--sf2);color:var(--ink);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--ac)}
input[type=file]{display:none}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;color:var(--mut)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
/* settings */
.grp{display:flex;flex-direction:column;gap:8px}
.grp>h3,.grp>h2{font:500 13px var(--fb);color:var(--mut);padding-inline:4px}
.set{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--ln)}
.set:first-child{border-top:0;padding-top:0}
.set:last-child{padding-bottom:0}
.set>.row>b,.set>button.row>b{flex:1;font-weight:500}
button.row{width:100%;text-align:start}
button.row svg{width:18px;height:18px;color:var(--mut)}
details.card{gap:0}
details.card>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;min-height:28px}
details>summary::-webkit-details-marker{display:none}
details>summary svg{width:18px;height:18px;color:var(--mut);transition:transform .2s}
details[open]>summary svg{transform:rotate(180deg)}
details.card>.body{display:flex;flex-direction:column;gap:12px;padding-top:14px}
details.in>summary{list-style:none;display:flex;align-items:center;gap:6px;color:var(--mut);font-size:15px;min-height:44px}
details.in>.body{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.er{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--ln)}
.er:first-child{border-top:0}
.er b{flex:1;font-weight:500;min-width:0}
.er.x{padding-inline-start:14px}
.er.x b{font-weight:400;cursor:pointer}
.er input{flex:1;min-width:0}
.sb{width:36px;height:36px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;color:var(--mut);flex:none}
.sb.on{color:var(--ac)}
.sb svg{width:16px;height:16px}
/* equipment */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;min-height:80px;padding:12px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);display:flex;align-items:flex-end;font-weight:500;font-size:14px;line-height:1.3;text-align:start;transition:transform .12s}
.tile.on{border-color:var(--ac);background:rgba(212,242,74,.07)}
.ck{position:absolute;top:10px;inset-inline-start:10px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ln);display:grid;place-items:center;color:transparent}
.tic{position:absolute;top:10px;inset-inline-end:10px;width:28px;height:28px;color:var(--mut)}
.tic svg{width:28px;height:28px}
.tile.on .tic{color:var(--ac)}
.tile.on .ck{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.ck svg{width:12px;height:12px}
.scan{width:100%;min-height:52px}
.awt{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.awt+.awt{border-top:1px solid var(--ln);padding-top:14px}
.awk{font:700 16px var(--fb)}
.awh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;font-size:14px;color:var(--mut)}
.awr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:center}
.awr .stp,.awr2 .stp{width:100%;justify-content:space-between;height:48px}
.awr .stp button,.awr2 .stp button{width:44px;height:48px;flex:none}
.awr .stp span,.awr2 .stp span{min-width:0;flex:1}
.awr .sb{width:40px;height:48px}
.awr2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.awr2 b{font-weight:500}
/* weights table: real <table> so screen readers announce column headers */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.awtb{width:100%;border-collapse:collapse}
.awtb caption{text-align:start}
.awtb thead th{font:500 13px/1.3 var(--fb);color:var(--mut);text-align:start;padding:0 0 6px}
.awtb td,.awtb tbody th{padding:6px 0;border-top:1px solid var(--ln);vertical-align:middle}
.awtb tbody th{font:700 16px var(--fn);text-align:start;white-space:nowrap}
.awtb td+td,.awtb th+td{padding-inline-start:8px}
.awtb .cq{width:1%}
.awtb .cx{width:44px}
.awin{width:100%;min-width:72px;text-align:center;font:700 17px var(--fn);padding:10px 6px;min-height:48px}
.awtb .stp{height:48px;justify-content:space-between;width:100%}
.awtb .stp button{width:44px;height:48px;flex:none}
.awtb .stp span{min-width:36px;flex:1}
.awtb .sb{width:44px;height:48px}
.awt .chips .chip{min-height:44px;min-width:52px;justify-content:center;font-family:var(--fn)}
.awadd{display:flex;gap:8px}
.awadd input{flex:1;min-width:0}
.awsum{font-size:14px;color:var(--mut)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(7,26,27,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav>div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;color:var(--dim);font-size:12px;font-weight:500}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ac)}
/* workout */
.wo{display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 40px)}
.wbar{display:flex;align-items:center;gap:12px}
.pg{flex:1;display:flex;gap:2px;height:4px}
.pg i{flex:1;border-radius:2px;background:var(--sf2)}
.pg i.ok{background:var(--ac)}
.pg i.now{background:var(--ink)}
.rest .pg i.ok{background:var(--run)}
.el{font:500 14px var(--fn);color:var(--mut);min-width:44px;text-align:end}
.wh{display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.wn{font-size:32px}
.ring{position:relative;width:min(240px,64vw);aspect-ratio:1;max-width:100%;margin:0 auto}
.ring svg{width:100%;height:100%;display:block}
.rt{fill:none;stroke:var(--sf2);stroke-width:10}
.rp{fill:none;stroke:var(--ac);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.rest .rp{stroke:var(--run)}
.rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.rv b{font:700 56px/1 var(--fn);font-variant-numeric:tabular-nums}
.rv small{color:var(--mut);font-size:14px}
.big{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.big b{font:700 84px/1 var(--fn);color:var(--ac);letter-spacing:-2px;font-variant-numeric:tabular-nums}
.big small{color:var(--mut)}
.fg3{width:100%;height:clamp(260px,52vh,440px);background:radial-gradient(120% 90% at 50% 20%,#0f3233,#05191a 70%);border-radius:16px;overflow:hidden}
.f3ld{height:100%;display:grid;place-items:center;color:var(--mut);font-size:14px}
.fg{width:100%;height:150px;background:#05191a;border-radius:16px;display:block}
.cap{font-size:14px;color:var(--mut);text-align:center}
.tips{margin:0;padding:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px;color:var(--mut);font-size:15px;text-align:start}
.nx{display:flex;align-items:center;gap:14px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px}
.rc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rc button{min-width:46px;height:46px;border-radius:12px;background:var(--sf2);font:700 17px var(--fn)}
.rc button.on{background:var(--run);color:var(--acx)}
.wact{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.okc{width:76px;height:76px;border-radius:50%;background:var(--ac);color:var(--acx);display:grid;place-items:center}
.okc svg{width:36px;height:36px}
.up{color:var(--ac)}.dn{color:var(--bad)}
/* auth */
.auth{display:flex;flex-direction:column;gap:18px;padding-top:20px}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px}
.wm{direction:ltr;font-family:var(--fn);text-align:center}
.wm b{display:block;font-size:42px;line-height:1;letter-spacing:-1px;color:var(--ink)}
.wm small{display:block;margin-top:8px;font-size:14px;font-weight:500;letter-spacing:6px;color:var(--ac)}
.d{min-height:44px;justify-content:center}
.chip,.seg button{min-height:44px}
.stp{height:44px}.stp button{width:44px;height:44px}
button.row{min-height:44px}
[tabindex="-1"]:focus{outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
